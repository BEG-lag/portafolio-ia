<text x="500" y="228" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#969dab" text-anchor="middle">Claude vía API</text>
<text x="500" y="242" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#969dab" text-anchor="middle">lee pasaportes y</text>
